    <html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DnD Clock — Player Display</title>
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
        <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
        <link rel="stylesheet" href="/static/css/styles.css">
    </head>
    <body class="theme-tavern page-display">
        <!-- Display Tab Views -->
        
        <!-- 1. TIMERS TAB (Combat View) -->
        <div id="tab-view-timers" class="display-tab-view" style="display:block;">
            <h1 style="text-align:center; padding:5px; font-family:'Cinzel', serif; font-size:48px; text-shadow:2px 2px 4px black; margin-top:10px; margin-bottom:5px;">Attack Order</h1>

            <div id="timers" style="
                display:grid;
                grid-template-columns:repeat(3,1fr);
                gap:18px;
                padding:15px 25px;
                max-width:1400px;
                margin:0 auto;
            "></div>

            <!-- Enemy Status Ribbon (Bottom) -->
            <div id="enemy-ribbon" style="display:none; max-width:1350px; margin:15px auto 10px; background:rgba(20, 10, 10, 0.85); border:1px solid rgba(231, 76, 60, 0.4); border-radius:8px; padding:10px 20px; box-shadow:0 4px 15px rgba(0,0,0,0.7); text-align:left;">
                <div style="font-family:'Cinzel', serif; font-size:14px; color:#e74c3c; font-weight:bold; margin-bottom:6px; letter-spacing:1px; text-transform:uppercase;">⚔️ Active Enemies</div>
                <div id="enemy-ribbon-content" style="display:flex; flex-wrap:wrap; gap:12px; align-items:center;"></div>
            </div>
                                      
            <div style="text-align:center; margin:15px 0 25px;">
                <div style="font-size:14px; opacity:0.8; margin-bottom:5px;">Scan to control your action cooldown</div>
                <img src="/qr" width="120" style="border-radius:6px; box-shadow:0 4px 10px rgba(0,0,0,0.5);">
            </div>  
        </div>

        <!-- 2. WORLD MAP TAB -->
        <div id="tab-view-map" class="display-tab-view" style="display:none; padding:20px; max-width:1300px; margin:0 auto;">
            <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:15px; flex-wrap:wrap; gap:12px;">
                <h1 id="display-map-main-title" style="font-family:'Cinzel', serif; font-size:40px; margin:0; color:#d4af37;">World Map</h1>
                <!-- Multi-map switcher buttons -->
                <div id="display-map-switcher-bar" class="display-map-switcher" style="display:none; flex-wrap:wrap; gap:8px; align-items:center;"></div>
            </div>
            <div id="display-map-toolbar" class="display-map-toolbar">
                <button id="display-map-edit-toggle" type="button" onclick="toggleDisplayMapEditing()">Edit Map</button>
                <span class="display-map-tool-divider"></span>
                <button type="button" onclick="zoomDisplayMap(0.8)" aria-label="Zoom out">−</button>
                <span id="display-map-zoom-level">100%</span>
                <button type="button" onclick="zoomDisplayMap(1.25)" aria-label="Zoom in">+</button>
                <button type="button" onclick="resetDisplayMapView()">Fit / Reset</button>
                <div id="display-map-edit-tools" class="display-map-edit-tools" style="display:none;">
                    <span class="display-map-tool-divider"></span>
                    <button type="button" data-map-tool="select" onclick="setDisplayMapTool('select')">Select</button>
                    <button type="button" data-map-tool="marker" onclick="setDisplayMapTool('marker')">Add Marker</button>
                    <button type="button" data-map-tool="rectangle" onclick="setDisplayMapTool('rectangle')">Rectangle</button>
                    <button type="button" data-map-tool="ellipse" onclick="setDisplayMapTool('ellipse')">Ellipse</button>
                    <button type="button" data-map-tool="line" onclick="setDisplayMapTool('line')">Line</button>
                    <button type="button" data-map-tool="pan" onclick="setDisplayMapTool('pan')">Pan</button>
                    <label class="display-map-property" id="display-map-marker-property" style="display:none;">
                        Marker
                        <input id="display-map-marker-label" type="text" maxlength="60" aria-label="Selected marker label">
                    </label>
                    <label class="display-map-property" id="display-map-shape-property" style="display:none;">
                        Color
                        <input id="display-map-shape-color" type="color" value="#e74c3c" aria-label="Shape color">
                        <input id="display-map-shape-opacity" type="range" min="10" max="90" value="30" aria-label="Shape opacity">
                        <span>Rotate</span>
                        <input id="display-map-shape-rotation" type="range" min="-180" max="180" value="0" aria-label="Selected shape rotation">
                        <output id="display-map-shape-rotation-value" for="display-map-shape-rotation">0°</output>
                    </label>
                    <button id="display-map-delete-selected" type="button" class="display-map-danger" style="display:none;" onclick="deleteSelectedDisplayMapItem()">Delete Selected</button>
                    <button id="display-map-save-retry" type="button" class="display-map-danger" style="display:none;" onclick="retrySaveDisplayMap()">Retry Save</button>
                </div>
                <span id="display-map-save-status" role="status" aria-live="polite">View only</span>
            </div>
            <div id="display-map-container" style="background:#111; border:2px solid #d4af37; border-radius:12px; padding:15px; min-height:500px; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative;">
                <div id="display-map-viewport">
                    <div id="map-img-wrapper">
                        <img id="display-map-img" src="" alt="World Map">
                        <div id="display-map-shapes"></div>
                        <div id="display-map-pins"></div>
                    </div>
                </div>
                <div id="display-map-empty" style="color:#888; font-size:18px;">No map image loaded yet. Add maps in Campaign Maintenance.</div>
                <div id="display-map-notes" style="margin-top:15px; font-size:16px; color:#c0b8a8; text-align:left; width:100%;"></div>
            </div>
        </div>

        <!-- 3. OBJECTIVES TAB -->
        <div id="tab-view-objectives" class="display-tab-view" style="display:none; padding:20px; max-width:1100px; margin:0 auto;">
            <h1 style="font-family:'Cinzel', serif; font-size:44px; margin-bottom:20px;">Current Objectives</h1>
            <div id="display-objectives-list" style="display:flex; flex-direction:column; gap:15px; text-align:left;"></div>
        </div>

        <!-- 4. RECAPS TAB -->
        <div id="tab-view-recaps" class="display-tab-view" style="display:none; padding:20px; max-width:1100px; margin:0 auto;">
            <h1 style="font-family:'Cinzel', serif; font-size:44px; margin-bottom:20px;">Session Recaps</h1>
            <div id="display-recaps-list" style="display:flex; flex-direction:column; gap:20px; text-align:left;"></div>
        </div>

        <script src="/static/js/session-sync.js"></script>
        <script src="/static/js/display.js"></script>
    </body>
    </html>
