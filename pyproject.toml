[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dnd-clock"
version = "0.1.0"
description = "Cooldown-based DnD combat support application"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dnd_clock = ["templates/**/*", "static/**/*"]
